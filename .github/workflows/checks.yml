name: AI Clipper checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q main.py config src web tests
      - name: Check dashboard JavaScript syntax
        run: node --check web/static/app.js

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt httpx
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p 'test_regressions.py' -v
      - name: Content-aware director tests
        run: python -m unittest discover -s tests -p 'test_editing_director.py' -v
      - name: Agent workflow and FFmpeg multipart integration tests
        run: python -m unittest discover -s tests -p 'test_agent_pipeline.py' -v
      - name: Stream highlight, chat and render-style tests
        run: python -m unittest discover -s tests -p 'test_live_highlights.py' -v
      - name: Continuous watcher lifecycle, chat and local capture tests
        run: python -m unittest discover -s tests -p 'test_live_watcher.py' -v
      - name: Web route tests
        run: python tests/test_web.py
