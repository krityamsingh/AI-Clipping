name: One GTA 6 highlight MP4
on:
  push:
    branches: [video/gta6-highlight-20261113]
jobs:
  build-one-video:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install video tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install -U pip yt-dlp
          python -m pip install -r requirements.txt
      - name: Download original GTA 6 video
        shell: bash
        run: |
          mkdir -p raw
          yt-dlp --no-playlist --no-warnings --js-runtimes node \
            -f 'bv*[height<=720]+ba/b[height<=720]/b' \
            --merge-output-format mp4 -o 'raw/source.%(ext)s' \
            'https://www.youtube.com/watch?v=EDaMIIk8oGk'
          ls -lh raw/
          test -f raw/source.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 raw/source.mp4
      - name: AI-Clipper selects and edits one 9:16 short
        shell: bash
        run: |
          python main.py 'raw/source.mp4' -n 1 -d 30 --aspect 9:16 --layout blur_fill --quality preview --model tiny
      - name: Validate and name MP4
        shell: bash
        run: |
          mkdir -p deliverables
          output=$(find previews/ -name '*.mp4' -type f -print -quit)
          test -n "$output"
          cp "$output" deliverables/GTA6_AI_Clipper_Short.mp4
          ffmpeg -v error -i deliverables/GTA6_AI_Clipper_Short.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height -show_entries format=duration -of json deliverables/GTA6_AI_Clipper_Short.mp4 > deliverables/verification.json
      - name: Save rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-AI-Clipper-Short
          path: deliverables/
          retention-days: 7
          if-no-files-found: error
